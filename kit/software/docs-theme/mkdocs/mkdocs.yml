# Merge into mkdocs.yml (MkDocs Material). Logo and favicon come from kit/web/.
theme:
  name: material
  logo: assets/favicon.svg            # kit/web/favicon.svg
  favicon: assets/favicon.svg
  font: false                          # fonts come from the stylesheet (type/fonts)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light }
extra_css:
  - stylesheets/fusionspace.css
